<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060a14">
<title>Starfall</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='%234fc3f7'/%3E%3Cellipse cx='32' cy='32' rx='30' ry='8' fill='none' stroke='%23ffb74d' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#060a14; --bg2:#0c1324; --panel:#0f1830cc; --line:#22314f; --text:#d7e3f4; --muted:#7f93b3;
  --acc:#4fc3f7; --acc2:#ffb74d; --ok:#81c784; --bad:#ef6f6f;
  --m:#c9ced8; --c:#7fd4f5; --d:#7ae0b0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 80% -10%,#16264a55,transparent),
  radial-gradient(900px 500px at -10% 110%,#2a173f44,transparent),var(--bg)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:
  radial-gradient(1px 1px at 20px 30px,#fff8,transparent),radial-gradient(1px 1px at 120px 80px,#fff6,transparent),
  radial-gradient(1px 1px at 200px 160px,#fff5,transparent),radial-gradient(1.5px 1.5px at 300px 40px,#fff7,transparent);
  background-size:340px 220px}
button,input,select{font:inherit;color:inherit}
button{background:#15223e;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){border-color:var(--acc);background:#1a2b4f}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:linear-gradient(180deg,#2a7fb0,#1b5a82);border-color:#3b9ad0;font-weight:600}
button.primary:hover:not(:disabled){background:linear-gradient(180deg,#3592c8,#226b98)}
button.mini{padding:3px 8px;font-size:12px;border-radius:6px}
button.mini.on{border-color:var(--acc);color:var(--acc)}
button.danger:hover{border-color:var(--bad);color:var(--bad)}
input,select{background:#0a1222;border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
input[type=number]{width:90px}
input:focus,select:focus{outline:none;border-color:var(--acc)}
h2{font-size:20px} h3{font-size:15px;margin-bottom:8px;color:#e9f2ff} h4{font-size:13px;margin:10px 0 4px;color:#b9cbe6}
a{color:var(--acc)}
.muted{color:var(--muted)} .small{font-size:12px} .ok{color:var(--ok)} .bad{color:var(--bad)}
.r0{color:var(--m)} .r1{color:var(--c)} .r2{color:var(--d)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;backdrop-filter:blur(4px)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>.panel{margin-bottom:0}
.grid2+.panel,.grid2{margin-bottom:12px}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{padding:5px 6px;border-bottom:1px solid #1a2742;text-align:left;vertical-align:middle}
.tbl th{color:var(--muted);font-weight:500;font-size:12px}
.tbl tr.own td{background:#4fc3f70d}
.scroll{overflow-x:auto}

/* menu */
.menu{max-width:560px;margin:0 auto;padding:28px 16px 40px}
.menu .panel label{display:block;margin:6px 0}
.menu .panel label input{display:block;width:100%;margin-top:3px}
.menu .row input{flex:1;min-width:0}
.logo{font-family:"Trebuchet MS",system-ui,sans-serif;letter-spacing:.35em;font-weight:800;text-align:center;font-size:42px;
  background:linear-gradient(90deg,#8fd8ff,#ffd18a);-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0 2px}
.logo.small{font-size:28px}
.logo.tiny{font-size:15px;letter-spacing:.25em;margin:0}
.tag{text-align:center;color:var(--muted);margin-bottom:18px}
.lang{display:flex;gap:4px;justify-content:flex-end}
.code{font-family:ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase}
.link{width:100%}
.settings{margin:8px 0}
.settings label{display:flex!important;justify-content:space-between;align-items:center;gap:8px}
.settings label select{width:auto}
.foot{text-align:center;margin-top:14px}
.pass{text-align:center;padding-top:80px}
.pass .big{font-size:20px;margin:18px 0}
.pass button{margin:6px}

/* game header */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;
  background:#070c18ee;border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.brand{display:flex;gap:12px;align-items:center}
.turn{color:var(--muted)} .turn b{color:var(--acc2);font-size:16px}
.planetSel{max-width:220px}
.res{display:flex;gap:6px;flex:1;min-width:0}
.rb{display:flex;flex-direction:column;padding:2px 8px;border:1px solid var(--line);border-radius:8px;min-width:70px;line-height:1.15;background:#0a1222}
.rb small{font-size:10px;color:var(--muted)} .rb b{font-size:14px} .rb i{font-size:10px;font-style:normal;color:var(--ok)}
.rb.full b{color:var(--bad)} .rb.bad b{color:var(--bad)}
.aps{display:flex;gap:6px}
.ap{padding:3px 8px;border-radius:999px;background:#13203c;border:1px solid #2b4370;font-size:12px;white-space:nowrap}
.endturn{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-left:auto}
.tabs{display:flex;gap:4px;padding:8px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #16213a}
.tabs button{white-space:nowrap;background:transparent;border-color:transparent}
.tabs button span{margin-right:5px;opacity:.8}
.tabs button.on{border-color:var(--acc);color:var(--acc);background:#4fc3f712}
.tabs em{font-style:normal;background:var(--acc2);color:#000;border-radius:999px;padding:0 6px;font-size:11px;margin-left:4px}
main{max-width:1180px;margin:0 auto;padding:14px}
.orders{max-width:1180px;margin:0 auto;padding:0 14px 30px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.orders details{flex:1}
.orders ol{margin:6px 0 6px 22px} .orders li{margin:2px 0}

/* overview */
.ov-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.alert{background:#4a141466;border:1px solid #a33;border-radius:10px;padding:10px;margin-bottom:12px}
.qi{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.bar{height:6px;background:#0a1222;border-radius:4px;overflow:hidden;border:1px solid #1f2d4a}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.pct{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-top:8px}
.pct label{display:flex;justify-content:space-between;gap:6px;align-items:center}
.help p{margin:4px 0}
details summary{cursor:pointer;color:#b9cbe6}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card.locked{opacity:.55}
.card .ic{flex:none;border-radius:10px}
.cb{flex:1;min-width:0}
.cb h3{display:flex;justify-content:space-between;gap:6px;margin-bottom:2px}
.lvl{color:var(--acc2);font-weight:500;font-size:12px;white-space:nowrap}
.desc{color:var(--muted);font-size:12px;margin-bottom:6px}
.cost{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-bottom:6px}
.cost .bad{color:var(--bad)}
.cost small{opacity:.7}
.req{font-size:12px;color:var(--muted);margin:4px 0}
.req .ok{color:var(--ok)} .req .bad,.req.bad{color:var(--bad)}
.cb>button{width:100%}
.stats{font-size:12px;color:#a9bbd8;margin-bottom:6px}
.buy{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.buy input{width:80px}
.buy button:last-child{flex:1}

/* fleet & galaxy */
.coords{display:flex;gap:4px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.coords input{width:64px}
.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0}
.cargo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.cargo input{width:100%}
.galnav{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.galnav input{width:70px}
.gal td.gp{width:34px}
.gal .acts{white-space:nowrap}
.gal .acts button{margin-right:3px}
.rep summary{font-weight:500}
.rep p{margin:6px 0}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);opacity:0;transition:.25s;background:#13203c;
  border:1px solid var(--line);padding:10px 16px;border-radius:10px;z-index:50;pointer-events:none;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--bad)} #toast.ok{border-color:var(--ok)}

@media (max-width:760px){
  .grid2{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .top{padding:6px 10px;gap:6px}
  .res{order:5;flex-basis:100%}
  .rb{flex:1;min-width:0;padding:2px 6px}
  .rb b{font-size:13px}
  .aps{order:6}
  .endturn{order:7;margin-left:auto}
  .planetSel{max-width:100%;flex:1}
  .tabs{padding:6px 8px}
  .tabs button{padding:6px 8px;font-size:13px}
  main{padding:10px}
  .missions{grid-template-columns:repeat(2,1fr)}
  .gal th:nth-child(4),.gal td:nth-child(4){display:none}
  .ov-head .pa svg{width:80px;height:80px}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="src/ui/app.js"></script>
</body>
</html>
