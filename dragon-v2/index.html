<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Chronicles of Azurerune — v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07070f;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'Courier New',monospace}
#gameContainer{position:relative;width:800px;height:480px;box-shadow:0 0 0 2px #1c1830,0 0 40px #000}
#gameParent canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
/* dialogue: parchment text in a framed night-blue box (the original's palette, a cleaner frame) */
/* the playfield is the bottom of the screen in v2, so dialogue sits at the TOP (the original kept it bottom, over an empty band) */
#dlg{position:absolute;top:58px;left:50%;transform:translateX(-50%);width:88%;max-width:680px;background:linear-gradient(#0c0c26f2,#06061af2);border:2px solid #c8a84e;box-shadow:0 0 0 2px #2a2010,inset 0 0 0 1px #5a4a20;border-radius:4px;padding:12px 18px 10px;color:#f0e6c0;font-size:14px;line-height:1.5;display:none;pointer-events:auto;z-index:10}
#dlg .sp{color:#e8c86a;font-weight:bold;margin-bottom:3px;font-size:12px;letter-spacing:1px;text-transform:uppercase}
#dlg .tx{min-height:36px}
#dlg .pr{color:#8a7a58;font-size:10px;margin-top:4px;text-align:right}
#title{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:auto;z-index:20;background:linear-gradient(rgba(5,8,24,.35),rgba(5,8,24,.78)),url("assets/world/castle_far.png");background-size:115% auto;background-position:0 0;image-rendering:pixelated}
#title h1{color:#e8c86a;font-size:34px;letter-spacing:2px;text-shadow:0 3px 0 #5a3a10,0 0 22px rgba(232,200,106,.45);margin-bottom:6px;text-align:center}
#title h2{color:#a8c8e8;font-size:15px;margin-bottom:22px;font-weight:normal;text-align:center;letter-spacing:1px}
.btn{pointer-events:auto;background:linear-gradient(#1c1838,#100e24);border:2px solid #c8a84e;box-shadow:0 2px 0 #5a4a20;color:#f0e0a8;padding:8px 30px;font-family:inherit;font-size:13px;font-weight:bold;cursor:pointer;margin:4px;border-radius:3px;outline:none;min-width:300px}
#langBtns .btn{min-width:64px;padding:6px 14px}
/* touch: the engine's bigger touch buttons + the party line-up must still fit the 480-px stage */
body.touch #title h1{font-size:28px;margin-bottom:2px}body.touch #title h2{margin-bottom:6px}
body.touch #title #langBtns{margin-bottom:4px!important}body.touch #title #langBtns .btn{padding:4px 14px;font-size:12px}
body.touch #title #levelBtns .btn{padding:6px 30px;font-size:14px;margin:3px;min-width:340px}
body.touch #title #castBox{margin-top:6px!important}body.touch #title #castBox .btn{padding:3px 12px!important}
#title h2{margin-bottom:10px}
.btn:hover{background:linear-gradient(#2a2450,#18143a);color:#fff}
.btn:focus{outline:none}
#hud{position:absolute;top:0;left:0;width:100%;padding:5px 8px;display:none;pointer-events:none;z-index:5;gap:5px;align-items:flex-start}
.hs{display:flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer;padding:2px 3px;border-radius:3px;border:2px solid transparent;background:rgba(6,6,20,.45)}
.hs.act{border-color:#c8a84e;background:rgba(200,168,78,.12)}
.hp-bar{width:32px;height:3px;background:#222;border-radius:1px;margin-top:2px}
.hp-fill{height:100%;border-radius:1px;transition:width .3s}
.hs .nm{color:#bbb;font-size:8px;margin-top:1px}
.hs .pf{width:28px;height:28px;border-radius:2px;image-rendering:pixelated;object-fit:cover;object-position:center top;display:block}
#hint{position:absolute;bottom:5px;right:8px;color:#c8b888;font-size:10px;pointer-events:none;z-index:6;text-shadow:0 1px 2px #000;max-width:60%;text-align:right}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;pointer-events:auto;z-index:25;text-align:center;background:rgba(6,6,20,.72)}
#overlay .ot{font-size:28px;font-weight:bold;color:#e8c86a;margin-bottom:18px;padding:0 12px;text-shadow:0 3px 0 #5a3a10}
#overlay .oo{font-size:14px;color:#f0e6c0;margin:5px 0;padding:0 24px}
#overlay .credits{font-size:13px;color:#a8c8e8;margin-top:6px}
#loadScr{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#07070f;z-index:30}
#loadScr .lt{color:#c8a84e;font-size:14px;margin-bottom:12px}
#loadScr .bar{width:200px;height:6px;background:#1a1a2a;border:1px solid #333;border-radius:3px}
#loadScr .fill{height:100%;background:#c8a84e;border-radius:2px;width:0%;transition:width .2s}
</style>
</head>
<body>
<div id="gameContainer">
<div id="gameParent"></div>
<div id="ui">
<div id="loadScr"><div class="lt">Loading…</div><div class="bar"><div class="fill" id="loadBar"></div></div></div>
<div id="title" style="display:none">
<h1>Chronicles of Azurerune</h1>
<h2>—</h2>
<div id="langBtns" style="margin-bottom:12px;display:flex;gap:6px"></div>
<div id="levelBtns" style="display:flex;flex-direction:column;align-items:center"></div>
</div>
<div id="hud"></div>
<div id="overlay"><div class="ot"></div><div class="opts"></div></div>
<div id="dlg"><div class="sp"></div><div class="tx"></div><div class="pr">[SPACE or CLICK]</div></div>
<div id="hint"></div>
</div>
</div>
<!-- Vendored Phaser 4.2.0 + the studio engine (phaser-1.16.0) — single folder, zero build. -->
<script src="phaser.min.js"></script>
<script src="src/engine.js"></script>
<script src="src/data.js"></script>
<script src="strings.js"></script>
<script src="src/fx.js"></script>
<script src="src/follow-familiar.js"></script>
<script src="src/scenes-base.js"></script>
<script src="src/lv1.js"></script>
<script src="src/lv2.js"></script>
<script src="src/lv3.js"></script>
<script src="src/lv4.js"></script>
<script src="src/lv5.js"></script>
<script src="src/levels.js"></script>
<script src="src/main.js"></script>
</body>
</html>
